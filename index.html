<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Offer & Phishing Inspector</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #d9534f; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        textarea, input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #0275d8; color: white; border: none; padding: 12px 20px; margin-top: 20px; cursor: pointer; width: 100%; border-radius: 4px; font-size: 16px; }
        button:hover { background-color: #025aa5; }
        .results { margin-top: 25px; padding: 15px; background: #eef; border-left: 5px solid #0275d8; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Phishing & Fake Offer Inspector</h1>
    <p>Paste suspicious job offer text or a URL below to calculate its Scam Threat Index.</p>
    
    <label for="offerText">Job Offer / Email Text:</label>
    <textarea id="offerText" rows="6" placeholder="Paste text here... (e.g., 'Dear candidate, pay $100 for training equipment...')"></textarea>
    
    <label for="offerUrl">Suspicious Link / URL:</label>
    <input type="text" id="offerUrl" placeholder="https://example-job-portal.com">
    
    <button onclick="analyzeOffer()">Scan for Threats</button>

    <div id="resultsBox" class="results">
        <h3>Analysis Results</h3>
        <p><strong>Scam Threat Index:</strong> <span id="threatScore">0</span>%</p>
        <p><strong>Detected Flags:</strong></p>
        <ul id="flagList"></ul>
    </div>
</div>

<script>
    function analyzeOffer() {
        const text = document.getElementById('offerText').value.toLowerCase();
        const url = document.getElementById('offerUrl').value.toLowerCase();
        let score = 10;
        let flags = [];

        if (text.includes('pay') || text.includes('fee') || text.includes('deposit') || text.includes('training cost')) {
            score += 40;
            flags.push("Requests upfront payment, fee, or training deposit.");
        }
        if (text.includes('whatsapp') || text.includes('telegram') || text.includes('gmail.com')) {
            score += 25;
            flags.push("Uses unofficial communication channels or free webmail providers.");
        }
        if (url.includes('-') || url.includes('.xyz') || url.includes('secure-') || url.length > 30) {
            score += 25;
            flags.push("Suspicious URL structure or lookalike domain indicators.");
        }

        if (score > 100) score = 100;

        document.getElementById('threatScore').innerText = score;
        const flagList = document.getElementById('flagList');
        flagList.innerHTML = '';
        
        if (flags.length === 0) {
            flags.push("No major immediate red flags found, but remain cautious.");
        }
        
        flags.forEach(flag => {
            let li = document.createElement('li');
            li.innerText = flag;
            flagList.appendChild(li);
        });

        document.getElementById('resultsBox').style.display = 'block';
    }
</script>

</body>
</html>
