<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Offer & Phishing Inspector</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #d9534f; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        textarea, input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #0275d8; color: white; border: none; padding: 12px 20px; margin-top: 20px; cursor: pointer; width: 100%; border-radius: 4px; font-size: 16px; }
        button:hover { background-color: #025aa5; }
        .results { margin-top: 25px; padding: 15px; background: #eef; border-left: 5px solid #0275d8; display: none; }
        #aiOutput { white-space: pre-wrap; line-height: 1.5; }
    </style>
</head>

<body>

<div class="container">

    <h1>Phishing & Fake Offer Inspector</h1>

    <p>
        Paste suspicious job offer text or a URL below to calculate its Scam Threat Index using AI.
    </p>
    
    <label for="apiKey">Gemini API Key:</label>

    <input
        type="password"
        id="apiKey"
        placeholder="Enter your Gemini API key..."
    >

    <label for="offerText">Job Offer / Email Text:</label>

    <textarea
        id="offerText"
        rows="6"
        placeholder="Paste text here... (e.g., 'Dear candidate, pay $100 for training equipment...')"
    ></textarea>
    
    <label for="offerUrl">Suspicious Link / URL:</label>

    <input
        type="text"
        id="offerUrl"
        placeholder="https://example-job-portal.com"
    >
    
    <button onclick="analyzeOffer()">
        Scan for Threats with AI
    </button>

    <div id="resultsBox" class="results">
        <h3>Analysis Results</h3>
        <p id="aiOutput">Analyzing...</p>
    </div>

</div>


<script>

async function analyzeOffer() {

    const apiKey = document.getElementById('apiKey').value.trim();

    const text = document.getElementById('offerText').value.trim();

    const url = document.getElementById('offerUrl').value.trim();

    const resultsBox = document.getElementById('resultsBox');

    const aiOutput = document.getElementById('aiOutput');


    // Check API key
    if (!apiKey) {
        alert("Please enter your Gemini API key.");
        return;
    }


    // Check input
    if (!text && !url) {
        alert("Please enter some text or a URL to analyze.");
        return;
    }


    // Show result box
    resultsBox.style.display = 'block';

    aiOutput.textContent = "Consulting AI security model...";


    // Prompt
    const prompt = `
Analyze this job offer or email and URL for phishing,
fake job offer, fraud, or scam risks.

Job Offer / Email Text:
${text || "No text provided."}

Suspicious Link / URL:
${url || "No URL provided."}

Give the result in this format:

Threat Score: XX/100

Risk Level: Low / Medium / High / Critical

Verdict:
Explain whether this appears suspicious and why.

Warning Signs:
- List the suspicious signs.
- Explain why each sign is suspicious.

URL Analysis:
Analyze the URL structure if provided.
Do not claim that you visited or verified the website.

Recommended Action:
Tell the user what they should do.

Important:
This is an AI-based risk assessment and is not a confirmed
cybersecurity verdict.
`;


    try {

        /*
         * Gemini Interactions API
         * Current model: Gemini 3.6 Flash
         */

        const response = await fetch(
            "https://generativelanguage.googleapis.com/v1beta/interactions",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "x-goog-api-key": apiKey
                },

                body: JSON.stringify({
                    model: "gemini-3.6-flash",
                    input: prompt
                })
            }
        );


        // Convert response to JSON
        const data = await response.json();


        // Check for API error
        if (!response.ok) {

            console.error("Gemini API Error:", data);

            const errorMessage =
                data?.error?.message ||
                data?.message ||
                "Gemini API request failed.";

            aiOutput.textContent =
                "Error: " + errorMessage;

            return;
        }


        /*
         * Get text from Interactions API response
         */

        let reply = "";


        if (data.steps && Array.isArray(data.steps)) {

            for (const step of data.steps) {

                if (
                    step.type === "model_output" &&
                    step.content &&
                    Array.isArray(step.content)
                ) {

                    for (const content of step.content) {

                        if (
                            content.type === "text" &&
                            content.text
                        ) {

                            reply += content.text;
                        }
                    }
                }
            }
        }


        // Fallback if response format is different
        if (!reply && data.output_text) {
            reply = data.output_text;
        }


        // Check if Gemini returned text
        if (!reply) {

            console.error(
                "Unexpected Gemini response:",
                data
            );

            aiOutput.textContent =
                "Error: Gemini returned an unexpected response.";

            return;
        }


        // Display result
        aiOutput.textContent = reply;

    }

    catch (error) {

        console.error(
            "Connection error:",
            error
        );

        aiOutput.textContent =
            "Error connecting to Gemini API: " +
            error.message;
    }

}

</script>

</body>
</html>
