<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Offer & Phishing Inspector</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #d9534f; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        textarea, input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #0275d8; color: white; border: none; padding: 12px 20px; margin-top: 20px; cursor: pointer; width: 100%; border-radius: 4px; font-size: 16px; }
        button:hover { background-color: #025aa5; }
        .results { margin-top: 25px; padding: 15px; background: #eef; border-left: 5px solid #0275d8; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Phishing & Fake Offer Inspector</h1>
    <p>Paste suspicious job offer text or a URL below to calculate its Scam Threat Index using AI.</p>
    
    <label for="apiKey">Gemini API Key:</label>
    <input type="password" id="apiKey" placeholder="Enter your Gemini API key...">

    <label for="offerText">Job Offer / Email Text:</label>
    <textarea id="offerText" rows="6" placeholder="Paste text here... (e.g., 'Dear candidate, pay $100 for training equipment...')"></textarea>
    
    <label for="offerUrl">Suspicious Link / URL:</label>
    <input type="text" id="offerUrl" placeholder="https://example-job-portal.com">
    
    <button onclick="analyzeOffer()">Scan for Threats with AI</button>

    <div id="resultsBox" class="results">
        <h3>Analysis Results</h3>
        <p id="aiOutput">Analyzing...</p>
    </div>
</div>

<script>
    async function analyzeOffer() {
        const apiKey = document.getElementById('apiKey').value;
        const text = document.getElementById('offerText').value;
        const url = document.getElementById('offerUrl').value;
        const resultsBox = document.getElementById('resultsBox');
        const aiOutput = document.getElementById('aiOutput');

        if (!apiKey) {
            alert("Please enter your Gemini API key.");
            return;
        }
        if (!text && !url) {
            alert("Please enter some text or a URL to analyze.");
            return;
        }

        resultsBox.style.display = 'block';
        aiOutput.innerHTML = "Consulting AI security model...";

        const prompt = `Analyze this job offer or text and URL for phishing or scam risks. Give a threat score percentage and list flags.\nText: ${text}\nURL: ${url}`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0].content) {
                const reply = data.candidates[0].content.parts[0].text;
                aiOutput.innerHTML = reply.replace(/\n/g, '<br>');
            } else {
                aiOutput.innerHTML = "Error: Invalid API key or response format.";
            }
        } catch (error) {
            aiOutput.innerHTML = `Error connecting to API: ${error.message}`;
        }
    }
</script>

</body>
</html>
